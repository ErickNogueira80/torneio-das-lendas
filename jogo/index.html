<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14111c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Torneio das Lendas · Jogo</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0910;overflow:hidden;overscroll-behavior:none}
  body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  canvas{display:block;touch-action:none;position:fixed;inset:0}
  #erro{display:none;position:fixed;left:0;right:0;bottom:0;z-index:3;background:#7a1010;color:#fff;font:12px/1.3 sans-serif;padding:6px 10px;word-break:break-all;-webkit-user-select:text;user-select:text}
  a.voltar{position:fixed;top:8px;right:10px;z-index:2;color:#b3a88f;font:14px "Crimson Pro",serif;text-decoration:none;opacity:.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="voltar" href="../">← portal</a>
<div id="erro"></div>
<script>
  // mostra na tela qualquer erro do jogo (no celular não há console para ver)
  window.mostrarErro = function (e, arq, linha) {
    var d = document.getElementById('erro'); if (!d || d.dataset.ok) return; d.dataset.ok = 1;
    var msg = (e && e.message) || String(e), pilha = (e && e.stack) || ((arq || '').split('/').pop() + ':' + linha);
    d.textContent = 'Erro no jogo: ' + msg + '  |  ' + String(pilha).split('\n').slice(0, 3).join(' / ') + '  |  ' + navigator.userAgent;
    d.style.display = 'block';
  };
  window.onerror = function (m, arq, linha, col, e) { window.mostrarErro(e || m, arq, linha); };
  window.addEventListener('unhandledrejection', function (ev) { window.mostrarErro(ev.reason); });
</script>
<!-- ?v= muda a cada publicação, para o celular não misturar arquivos novos com antigos do cache -->
<script src="dados/herois.js?v=arv1"></script>
<script src="dados/fases.js?v=arv1"></script>
<script src="jogo.js?v=arv1"></script>
</body>
</html>
