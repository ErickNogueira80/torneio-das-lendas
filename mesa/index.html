<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#120e1a">
<title>Mesa · Torneio das Lendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:wght@400;600&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#120e1a;--bg2:#1c1626;--line:#3a2f4a;--text:#ece4d4;--muted:#b3a88f;--gold:#e3b75a;--gold2:#f5d48a}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(ellipse at top,#2a2040 0%,var(--bg) 60%) fixed,var(--bg);color:var(--text);
  font-family:'Crimson Pro',Georgia,serif;font-size:19px;min-height:100%}
header{padding:16px 16px 6px;text-align:center}
header h1{font-family:Cinzel,serif;color:var(--gold);font-size:22px;margin:0;letter-spacing:.06em}
#sub{margin:6px 0 0;color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:30px}
#sub .eu{color:var(--gold2);font-family:Cinzel,serif;font-size:17px}
#sub img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--gold);background:#fff}
main{max-width:1100px;margin:0 auto;padding:10px 16px 100px}
.espera{text-align:center;color:var(--muted);padding:60px 10px}
.espera .estrela{font-size:64px;color:var(--gold);opacity:.6;animation:pulsa 2.4s ease-in-out infinite}
@keyframes pulsa{50%{opacity:1;transform:scale(1.08)}}
.atual{margin:8px 0 26px}
.carta{background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:zoom-in}
.carta img{width:100%;aspect-ratio:16/9;object-fit:contain;display:block;background:#0e0b14}
.carta h2{font-family:Cinzel,serif;color:var(--gold2);margin:0;padding:12px 16px 14px;font-size:24px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lista .carta h2{font-size:17px;padding:8px 12px 10px}
.rotulo{font-family:Cinzel,serif;color:var(--gold);font-size:14px;letter-spacing:.08em;margin:0 0 10px}
.ov{position:fixed;inset:0;background:rgba(8,6,12,.95);display:none;align-items:center;justify-content:center;
  flex-direction:column;z-index:20;padding:16px;text-align:center}
.ov.on{display:flex}
#zoom img,#novo img{max-width:100%;max-height:78vh;border-radius:12px}
#novo small{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.2em;font-size:15px}
#novo h2{font-family:Cinzel,serif;color:var(--gold2);font-size:30px;margin:10px 0 0}
#novo .wrap{animation:surge 1.2s ease-out}
@keyframes surge{from{opacity:0;transform:scale(.85);filter:blur(10px) brightness(2)}to{opacity:1;transform:none;filter:none}}
.aviso{color:var(--muted);text-align:center;font-size:15px}
/* barra de navegação */
nav#barra{position:fixed;left:0;right:0;bottom:0;z-index:15;display:none;background:rgba(18,14,26,.97);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav#barra.on{display:flex;justify-content:center;gap:4px}
nav#barra button{flex:1;max-width:180px;font:inherit;background:transparent;border:0;color:var(--muted);padding:6px 4px 4px;border-radius:12px;cursor:pointer;position:relative}
nav#barra button span{display:block;font-size:22px;line-height:1.1}
nav#barra button small{font-family:Cinzel,serif;font-size:12px;letter-spacing:.04em}
nav#barra button.on{color:var(--gold2);background:rgba(227,183,90,.12)}
nav#barra button i{position:absolute;top:4px;right:calc(50% - 22px);width:10px;height:10px;border-radius:50%;background:#e2553c;display:none}
nav#barra button.novo i{display:block}
/* quem é você */
.quem{text-align:center;padding:24px 0}
.quem h2{font-family:Cinzel,serif;color:var(--gold2);font-size:26px;margin:0 0 6px}
.quem p{color:var(--muted);margin:0 0 22px}
.herois{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:520px;margin:0 auto}
.heroi{font:inherit;color:var(--text);background:var(--bg2);border:2px solid var(--line);border-radius:16px;padding:18px 10px;cursor:pointer}
.heroi b{display:block;font-family:Cinzel,serif;font-size:22px;color:var(--gold2);margin:6px 0 2px}
.heroi span{font-size:40px}
.heroi small{color:var(--muted)}
.heroi:disabled{opacity:.45;cursor:not-allowed}
/* lista do portão: o pergaminho do jogo (jogo/sprites/hud/pergaminho.png, 1090×520) cortado em 9 partes */
.pergaminho{border-style:solid;border-width:44px 50px 40px;border-image:url('../jogo/sprites/hud/pergaminho.png') 112 138 96 138 fill / 44px 50px 40px stretch;
  color:#3a2410;margin:8px -6px 26px;padding:2px 4px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.5))}
.pergaminho h2{font-family:'IM Fell English SC',Cinzel,serif;text-align:center;margin:0 0 8px;font-size:28px;color:#5a1e0c;font-weight:400}
.pergaminho ol{list-style:none;margin:0;padding:0}
.pergaminho li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(110,74,36,.25);font-size:21px;min-height:40px}
.pergaminho li:last-child{border-bottom:0}
.nome{font-family:'IM Fell English SC',Cinzel,serif;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.nome .l{text-transform:uppercase;display:inline-block;min-width:1.1em;text-align:center;background:rgba(110,74,36,.14);border-radius:4px;padding:0 3px;line-height:1.3}
.nome .l.nova{animation:brilha 2.6s ease-out}
.nome .misterio{color:rgba(110,74,36,.55);font-family:'IM Fell English',serif;font-style:italic;font-size:18px}
@keyframes brilha{0%{color:#fff;background:#e3b75a;box-shadow:0 0 16px #ffd76a;transform:scale(1.5)}100%{transform:none}}
.morto .nome{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75;letter-spacing:.04em}
.selo{margin-left:auto;font-family:'IM Fell English',serif;font-size:16px;font-style:italic;color:#8a2a1a;white-space:nowrap}
.dogtags{text-align:center;font-family:'IM Fell English',serif;font-style:italic;font-size:16px;color:#6e4a24;margin-top:8px}
/* ficha do jogador */
.ficha{max-width:560px;margin:0 auto;background:var(--bg2);border:1px solid var(--gold);border-radius:16px;padding:18px 16px 20px}
.ficha .topo{display:flex;gap:14px;align-items:center}
.ficha .foto{position:relative;flex:none;cursor:pointer}
.ficha .foto img{width:110px;height:130px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
.ficha .foto em{position:absolute;right:-6px;bottom:-6px;background:var(--gold);color:#1b1408;border-radius:50%;width:28px;height:28px;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.ficha small.k{display:block;font-family:Cinzel,serif;color:var(--gold);font-size:13px;letter-spacing:.08em}
.ficha h2{font-family:Cinzel,serif;color:var(--gold2);margin:2px 0 4px;font-size:24px}
.ficha h3{font-family:Cinzel,serif;color:var(--gold);font-size:15px;letter-spacing:.08em;margin:18px 0 6px}
.ficha .st{display:flex;gap:6px;flex-wrap:nowrap}
.ficha .st div{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 2px;text-align:center}
.ficha .st b{display:block;font-family:Cinzel,serif;font-size:22px;color:var(--gold2)}
.ficha .st span{font-size:12px;color:var(--muted)}
.ficha table{width:100%;border-collapse:collapse;font-size:17px}
.ficha td,.ficha th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
.ficha th{font-family:Cinzel,serif;font-weight:600;font-size:13px;color:var(--gold);letter-spacing:.06em}
.ficha ul{margin:0;padding-left:20px}
.ficha .vazio{color:var(--muted);font-style:italic}
.btn{font:inherit;font-size:16px;border-radius:999px;border:1px solid var(--gold);background:var(--gold);color:#1b1408;font-weight:600;padding:8px 22px;cursor:pointer}
/* escolha do avatar */
#avatar .opcoes{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0}
#avatar .op{font:inherit;color:var(--text);background:var(--bg2);border:2px solid var(--line);border-radius:14px;padding:10px;width:150px;cursor:pointer}
#avatar .op.on{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,183,90,.35)}
#avatar .op img{width:128px;height:150px;object-fit:cover;border-radius:10px;background:#fff;display:block;margin:0 auto 8px}
#avatar .op:disabled{opacity:.5;cursor:not-allowed}
#avatar .op .falta{width:128px;height:150px;border-radius:10px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;
  margin:0 auto 8px;color:var(--muted);font-size:14px;padding:8px}
/* revelações da mestre (marca, elemento, mensagem): tela cheia com efeito */
.selos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.elem,.marca{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;border:1px solid var(--c);color:var(--c);
  font-family:Cinzel,serif;font-weight:600;font-size:15px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.marca{padding:1px 12px 1px 4px}
.marca .const{width:30px;height:30px}
.marca .const line{stroke-width:3}
.marca .const circle{r:5}
#revela{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--c) 38%,#000) 0%,#05040a 68%);overflow:hidden}
#revela .ceu{position:absolute;inset:0;pointer-events:none}
#revela .ceu b{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.15;animation:rv-pisca var(--d) ease-in-out infinite alternate}
#revela .wrap{position:relative;z-index:1;text-align:center}
#revela small{display:block;font-family:Cinzel,serif;letter-spacing:.25em;color:var(--gold);font-size:15px;animation:rv-sobe .8s both}
#revela .sim{font-size:120px;line-height:1.1;margin:14px 0 4px;animation:rv-surge 1.4s .4s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 0 28px var(--c))}
#revela .const{width:min(76vw,340px);height:min(76vw,340px);display:block;margin:6px auto 0;overflow:visible;filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 18px var(--c))}
#revela .const .e{transform-box:fill-box;transform-origin:center;animation:rv-estrela .7s cubic-bezier(.2,1.8,.4,1) both;animation-delay:var(--t)}
#revela .const .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:rv-traco .5s ease-out forwards}
#revela h2{font-family:Cinzel,serif;font-size:44px;margin:4px 0 0;color:var(--c);text-shadow:0 0 22px var(--c),0 0 4px #fff;letter-spacing:.06em;animation:rv-sobe 1s both}
#revela .sub{color:#d9d2e6;font-size:20px;font-style:italic;margin:10px 0 0;animation:rv-sobe 1.2s both}
#revela .msg{font-family:'IM Fell English',serif;font-size:27px;line-height:1.35;color:#f6e7c6;max-width:620px;margin:14px auto 0;text-shadow:0 0 18px rgba(227,183,90,.5);animation:rv-sobe 1.2s both}
#revela .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#fff 0,var(--c) 20%,transparent 62%);opacity:0;animation:rv-flash 1.6s both;pointer-events:none}
#revela .anel{position:absolute;left:50%;top:45%;width:40px;height:40px;margin:-20px;border:3px solid var(--c);border-radius:50%;opacity:0;animation:rv-anel 1.8s ease-out both;pointer-events:none}
#revela .faisca{position:absolute;left:50%;top:45%;width:7px;height:7px;margin:-3px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c),0 0 3px #fff;opacity:0;animation:rv-faisca 1.7s ease-out both;pointer-events:none}
#revela .toque{position:absolute;bottom:24px;left:0;right:0;animation:rv-sobe 1s both}
/* a marca que não aparece (Câncer): estrelas fracas tremem e somem */
#revela.oculta .const{filter:none;animation:rv-some 1.4s 3s forwards}
#revela.oculta .const .e{opacity:.5;animation:rv-estrela .7s both,rv-falha .2s steps(2) 6;animation-delay:var(--t),2s}
@keyframes rv-pisca{to{opacity:.9}}
@keyframes rv-sobe{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes rv-surge{0%{transform:scale(.1) rotate(-40deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes rv-estrela{0%{transform:scale(0);opacity:0}60%{transform:scale(2.4);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rv-traco{to{stroke-dashoffset:0}}
@keyframes rv-flash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
@keyframes rv-anel{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(16)}}
@keyframes rv-faisca{0%{opacity:1;transform:none}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}}
@keyframes rv-some{to{opacity:.05;filter:blur(4px)}}
@keyframes rv-falha{50%{opacity:.1}}
/* nova criatura: surge do clarão e a tela treme */
#revela img.bicho{display:block;max-width:min(92vw,560px);max-height:56vh;margin:12px auto 0;border-radius:14px;box-shadow:0 0 36px var(--c),0 0 4px #fff;animation:rv-bicho 1.4s .35s both}
#revela.treme .wrap{animation:rv-treme .55s .55s both}
@keyframes rv-bicho{0%{opacity:0;transform:scale(.55);filter:blur(16px) brightness(3)}55%{opacity:1;filter:blur(0) brightness(1.7)}100%{transform:none;filter:none}}
@keyframes rv-treme{0%,100%{transform:none}15%{transform:translate(-9px,4px)}30%{transform:translate(8px,-5px)}45%{transform:translate(-7px,-3px)}60%{transform:translate(6px,5px)}75%{transform:translate(-4px,2px)}}
#som{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:16;font-size:20px;background:rgba(28,22,38,.9);border:1px solid var(--line);
  border-radius:50%;width:40px;height:40px;cursor:pointer;color:var(--text);padding:0}
#aviso-lista{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#e3b75a;color:#1b1408;font-weight:600;padding:10px 20px;
  border-radius:999px;display:none;z-index:16;box-shadow:0 4px 18px rgba(0,0,0,.5);text-align:center;max-width:90vw;cursor:pointer}
</style>
</head>
<body>
<header>
  <h1>✦ Torneio das Lendas</h1>
  <div id="sub">As criaturas que vocês encontraram</div>
</header>
<button id="som" title="Som ligado/desligado">🔊</button>
<main id="app"><div class="espera"><div class="estrela">✦</div><p>Conectando…</p></div></main>
<nav id="barra">
  <button data-v="criaturas"><i></i><span>🐉</span><small>Criaturas</small></button>
  <button data-v="locais" hidden><i></i><span>🗺️</span><small>Locais</small></button>
  <button data-v="lista" hidden><i></i><span>📜</span><small>Lista</small></button>
  <button data-v="ficha"><i></i><span>🧾</span><small>Minha ficha</small></button>
</nav>
<div id="zoom" class="ov" data-ov="zoom"><img alt=""><p class="aviso">Toque para fechar</p></div>
<div id="novo" class="ov" data-ov="novo"><div class="wrap"><small>NOVA CRIATURA</small><br><img alt=""><h2></h2><p class="aviso">Toque para fechar</p></div></div>
<div id="avatar" class="ov" data-ov="avatar"></div>
<div id="revela" class="ov" data-ov="revela"></div>
<div id="aviso-lista"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase.js?v=2"></script>
<script src="fichas.js?v=3"></script>
<script src="estrelas.js?v=1"></script>
<script>
(function () {
  // Os quatro jogadores (caderno, p. 34). Marca e elemento só depois que a mestre revela, um a um (Erick, 2026-11-25). Cada nome fica
  // reservado para o 1º celular que escolher (mesa/jogadores/<id> = {dev, avatar}); só a mestre libera.
  const JOGADORES = [
    { id: 'miguel', nome: 'Miguel' }, { id: 'bia', nome: 'Bia' }, { id: 'mateus', nome: 'Mateus' }, { id: 'joao', nome: 'João' },
  ];
  // Navegação: cada aba é um endereço (#criaturas, #lista, #ficha) e cada janela por cima (imagem
  // ampliada, nova criatura, escolha do avatar) é um passo no histórico. Assim o "voltar" do Android
  // fecha a janela ou volta de aba, em vez de sair da página.
  const ABAS = ['criaturas', 'locais', 'lista', 'ficha'];
  const $ = id => document.getElementById(id);
  const app = $('app'), sub = $('sub'), barra = $('barra'), avisoEl = $('aviso-lista');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const src = b => '../web/bestiario/' + encodeURIComponent(b.img) + '.jpg';
  const srcL = b => '../web/locais/' + encodeURIComponent(b.img) + '.jpg';
  const carta = (b, f) => { const u = (f || src)(b); return `<div class="carta" data-src="${u}"><img src="${u}" alt="${esc(b.nome)}"><h2>${esc(b.nome)}</h2></div>`; };
  const ESPERA = t => `<div class="espera"><div class="estrela">✦</div><p>${t}</p></div>`;
  const ler = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const gravar = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
  const NOMES_ST = { F: 'Força', I: 'Intelecto', V: 'Vigor', A: 'Agilidade', P: 'Presença' };

  if (!window.FIREBASE_CONFIG) { app.innerHTML = ESPERA('A mesa ainda não foi configurada.'); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const db = firebase.database();

  let dev = ler('tdl_dev'); if (!dev) { dev = Math.random().toString(36).slice(2) + Date.now().toString(36); gravar('tdl_dev', dev); }
  let eu = JOGADORES.find(j => j.id === ler('tdl_jogador')) || null;
  let donos = null, bosses = null, lista = null, locais = null, primeiraVez = false;
  // Revelações da mestre: chegam só quando ela libera (mesa/constelacoes, mesa/elementos, mesa/mensagem).
  // Quem é de qual signo/elemento não fica no código desta página, só no portal trancado.
  let elementos = null, constelacoes = null, mensagem = null;
  const ELEM = { fogo: ['🔥', 'Fogo', '#ff7a33'], terra: ['🌿', 'Terra', '#8fd15a'], ar: ['🌪️', 'Ar', '#bfe6ff'],
    agua: ['🌊', 'Água', '#4fb3ff'], nenhum: ['✧', 'Nenhum', '#c9c2d6'] };
  // um item por jogador ({v, t}); aceita também o formato antigo (todos de uma vez, com "liberado")
  const itemDe = (o, id) => { const x = o && o[id]; if (!x) return null; return typeof x === 'string' ? (o.liberado ? { v: x, t: o.t || 0 } : null) : x; };
  const meuElem = () => { const x = eu && itemDe(elementos, eu.id); return x && ELEM[x.v] ? { ...x, e: ELEM[x.v] } : null; };
  const minhaMarca = () => { const x = eu && itemDe(constelacoes, eu.id); return x && (x.v === 'oculta' || (window.CONSTELACOES || {})[x.v]) ? x : null; };
  function selos() {
    const e = meuElem(), m = minhaMarca(); if (!e && !m) return '';
    const sm = !m ? '' : m.v === 'oculta' ? `<span class="marca" style="--c:#9a90ad">${svgConstelacao('vazia').svg} Marca: não apareceu</span>`
      : `<span class="marca" style="--c:${CONSTELACOES[m.v].cor}">${svgConstelacao(m.v).svg} ${CONSTELACOES[m.v].nome}</span>`;
    return `<div class="selos">${sm}${e ? `<span class="elem" style="--c:${e.e[2]}">${e.e[0]} ${e.e[1]}</span>` : ''}</div>`;
  }
  let vistos = null, letrasAntes = null, listaAntes = null;
  const novidade = { criaturas: false, locais: false, lista: false };

  // ---------- navegação ----------
  const aba = () => { const h = location.hash.slice(1); return ABAS.includes(h) && !(h === 'lista' && !(lista && lista.entregue)) && !(h === 'locais' && !listaLocais().length) ? h : 'criaturas'; };
  function irPara(v) { if (v !== aba() || location.hash !== '#' + v) { history.pushState(null, '', '#' + v); sincronizar(); } }
  function abrirJanela(ov) { history.pushState({ ov }, '', location.hash || '#criaturas'); sincronizar(); }
  function fecharJanela() { if (history.state && history.state.ov) history.back(); }
  function sincronizar() {
    const ov = history.state && history.state.ov;
    document.querySelectorAll('.ov').forEach(o => o.classList.toggle('on', o.dataset.ov === ov));
    if (!ov) { novidade[aba()] = false; render(); window.scrollTo({ top: 0 }); setTimeout(proxima, 400); }
  }

    if (c) { $('zoom').querySelector('img').src = c.dataset.src; abrirJanela('zoom'); }
  });
  if (history.state && history.state.ov) history.replaceState(null, '', location.hash || '#criaturas');   // recarregou com janela aberta
  sincronizar();
})();
</script>
</body>
</html>
